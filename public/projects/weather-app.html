<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #74b9ff, #0984e3);
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
        margin: 0;
        padding: 40px 20px;
      }

      #weather-app {
        max-width: 600px;
        margin: auto;
        padding: 30px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 20px;
      }

      h1 {
        margin-top: 0;
      }

      select,
      button {
        padding: 12px 18px;
        margin: 8px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        background: #ffeaa7;
        color: #2d3436;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background: #fdcb6e;
      }

      #weather-info {
        margin-top: 30px;
      }

      #weather-icon {
        width: 100px;
        height: 100px;
      }

      .weather-item {
        margin: 10px 0;
        font-size: 18px;
      }

      #location {
        font-size: 28px;
        font-weight: bold;
        margin: 15px;
      }
    </style>
  </head>

  <body>

    <div id="weather-app">

      <h1>Weather App</h1>

      <select id="city-select">
        <option value=""></option>
        <option value="new york">New York</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="paris">Paris</option>
        <option value="tokyo">Tokyo</option>
        <option value="london">London</option>
      </select>

      <button id="get-weather-btn">
        Get Weather
      </button>

      <div id="weather-info">

        <img id="weather-icon" src="" alt="Weather icon">

        <div id="location"></div>

        <div class="weather-item">
          Temperature:
          <span id="main-temperature"></span>
        </div>

        <div class="weather-item">
          Feels Like:
          <span id="feels-like"></span>
        </div>

        <div class="weather-item">
          Humidity:
          <span id="humidity"></span>
        </div>

        <div class="weather-item">
          Wind:
          <span id="wind"></span>
        </div>

        <div class="weather-item">
          Wind Gust:
          <span id="wind-gust"></span>
        </div>

        <div class="weather-item">
          Weather:
          <span id="weather-main"></span>
        </div>

      </div>
    </div>


    <script>
      const citySelect = document.getElementById("city-select");
      const getWeatherBtn = document.getElementById("get-weather-btn");

      const weatherIcon = document.getElementById("weather-icon");
      const mainTemperature = document.getElementById("main-temperature");
      const feelsLike = document.getElementById("feels-like");
      const humidity = document.getElementById("humidity");
      const wind = document.getElementById("wind");
      const windGust = document.getElementById("wind-gust");
      const weatherMain = document.getElementById("weather-main");
      const locationElement = document.getElementById("location");


      async function getWeather(city) {
        try {
          const response = await fetch(
            `https://weather-proxy.freecodecamp.rocks/api/city/${city}`
          );

          if (!response.ok) {
            throw new Error("Weather request failed");
          }

          const data = await response.json();

          return data;

        } catch (error) {
          console.error(error);
        }
      }


      async function showWeather(city) {
        const data = await getWeather(city);

        if (!data) {
          alert("Something went wrong, please try again later.");
          return;
        }

        const iconCode = data.weather?.[0]?.icon;

        weatherIcon.src = iconCode
          ? `https://openweathermap.org/img/wn/${iconCode}@2x.png`
          : "";

        weatherIcon.alt =
          data.weather?.[0]?.description || "Weather icon";

        mainTemperature.textContent =
          data.main?.temp !== undefined
            ? `${data.main.temp} °C`
            : "N/A";

        feelsLike.textContent =
          data.main?.feels_like !== undefined
            ? `${data.main.feels_like} °C`
            : "N/A";

        humidity.textContent =
          data.main?.humidity !== undefined
            ? `${data.main.humidity}%`
            : "N/A";

        wind.textContent =
          data.wind?.speed !== undefined
            ? `${data.wind.speed} m/s`
            : "N/A";

        windGust.textContent =
          data.wind?.gust !== undefined
            ? `${data.wind.gust} m/s`
            : "N/A";

        weatherMain.textContent =
          data.weather?.[0]?.main !== undefined
            ? data.weather[0].main
            : "N/A";

        locationElement.textContent =
          data.name !== undefined
            ? data.name
            : "N/A";
      }


      getWeatherBtn.addEventListener("click", () => {
        const city = citySelect.value;

        if (city === "") {
          return;
        }

        showWeather(city);
      });
    </script>

  </body>
</html>
