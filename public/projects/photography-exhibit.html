<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 p-8">

    <h1 class="text-3xl font-bold text-center mb-8">
      Photography Exhibit
    </h1>

    <div class="main-container grid grid-cols-3 gap-6">

      <div class="card rounded-lg border p-4 bg-white">
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg"
          alt="Colosseum in Rome"
          class="rounded-lg"
        />

        <h2 class="subheading font-bold text-xl mt-4">
          The Colosseum
        </h2>

        <p class="description text-sm mt-2">
          A beautiful view of the historic Colosseum in Rome, Italy.
        </p>
      </div>

      <div class="card rounded-lg border p-4 bg-white">
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg"
          alt="Snowy Alps mountains"
          class="rounded-lg"
        />

        <h2 class="subheading font-bold text-xl mt-4">
          The Alps
        </h2>

        <p class="description text-sm mt-2">
          Peaceful mountain scenery surrounded by the magnificent Alps.
        </p>
      </div>

      <div class="card rounded-lg border p-4 bg-white">
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg"
          alt="Blue sea and coastline"
          class="rounded-lg"
        />

        <h2 class="subheading font-bold text-xl mt-4">
          The Blue Sea
        </h2>

        <p class="description text-sm mt-2">
          A relaxing coastal scene showing the beauty of the open sea.
        </p>
      </div>

    </div>

  </body>
</html>
